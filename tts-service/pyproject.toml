[project]
name = "tts-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pydub>=0.25",
    "audioop-lts>=0.2; python_version >= \"3.13\"",
    "boto3>=1.34",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tts_app*"]
